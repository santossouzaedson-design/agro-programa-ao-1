 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - Sustentabilidade no Campo</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --secondary: #0288d1;
            --background: #f1f8e9;
            --text: #263238;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-dark);
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #e0f7fa;
            border-left: 6px solid var(--secondary);
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .result-box h3 {
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .dica {
            margin-top: 15px;
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #78909c;
        }
    </style>
</head>
<body>

    <header>
        <h1>EcoAgro - Calculadora Agrinho 2026</h1>
        <p>Gestão Inteligente da Água e Sustentabilidade na Agricultura</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="cultura">Selecione a Cultura:</label>
            <select id="cultura">
                <option value="soja">Soja (Média de 2.000L por kg)</option>
                <option value="milho">Milho (Média de 1.200L por kg)</option>
                <option value="trigo">Trigo (Média de 1.800L por kg)</option>
                <option value="arroz">Arroz (Média de 2.500L por kg)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="producao">Produção estimada (em Kg):</label>
            <input type="number" id="producao" placeholder="Ex: 1000" min="1">
        </div>

        <button onclick="calcularPegada()">Calcular Impacto Hídrico</button>

        <div id="resultado" class="result-box">
            <h3>Resultado da Análise</h3>
            <p id="texto-resultado"></p>
            
            <div class="dica">
                <strong>Dica de Sustentabilidade Agrinho:</strong>
                <p id="texto-dica"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>Projeto Front-end desenvolvido para o Concurso Agrinho 2026</p>
    </footer>

    <script>
        function calcularPegada() {
            const cultura = document.getElementById('cultura').value;
            const producao = parseFloat(document.getElementById('producao').value);
            const resultadoDiv = document.getElementById('resultado');
            const textoResultado = document.getElementById('texto-resultado');
            const textoDica = document.getElementById('texto-dica');

            if (isNaN(producao) || producao <= 0) {
                alert('Por favor, insira uma quantidade válida de produção.');
                return;
            }

            let fatorAgua = 0;
            let dicas = '';

            switch (cultura) {
                case 'soja':
                    fatorAgua = 2000;
                    dicas = 'Utilize o plantio direto para manter a umidade do solo e reduzir a evaporação da água.';
                    break;
                case 'milho':
                    fatorAgua = 1200;
                    dicas = 'Monitore o solo com sensores de umidade para irrigar apenas quando estritamente necessário.';
                    break;
                case 'trigo':
                    fatorAgua = 1800;
                    dicas = 'A rotação de culturas ajuda a melhorar a estrutura do solo, otimizando a absorção de água da chuva.';
                    break;
                case 'arroz':
                    fatorAgua = 2500;
                    dicas = 'Considere sistemas de irrigação intermitente para reduzir o uso contínuo de lâminas de água.';
                    break;
            }

            const totalAgua = producao * fatorAgua;
            
            textoResultado.innerHTML = `Para produzir <strong>${producao.toLocaleString('pt-BR')} kg</strong> de ${cultura.toUpperCase()}, são necessários aproximadamente <strong>${totalAgua.toLocaleString('pt-BR')} litros</strong> de água ao longo do ciclo.`;
            textoDica.innerText = dicas;
            
            resultadoDiv.classList.add('show');
        }
    </script>
</body>
</html>
